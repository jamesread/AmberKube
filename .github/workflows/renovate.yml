---
# Self-hosted Renovate (weekly). Uses GITHUB_TOKEN so scheduled runs work without a PAT.
# To have Renovate PRs trigger other workflows, replace with a fine-grained PAT
# (Contents/Issues/PRs) in RENOVATE_TOKEN and set token: ${{ secrets.RENOVATE_TOKEN }}.
name: Renovate

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.14
        with:
          token: ${{ github.token }}
        env:
          LOG_LEVEL: debug
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }}
          RENOVATE_INTERNAL_CHECKS_FILTER: strict
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: true
